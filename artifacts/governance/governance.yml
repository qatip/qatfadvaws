name: Governance of governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: Governance-of-governance gate
    runs-on: ubuntu-latest
    steps:
      - name: Validate governance ownership
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -ne 'pull_request') {
            Write-Host 'Manual run: no pull request to validate.'
            exit 0
          }

          # All PRs run this job so it can be a required status check.
          $files = @(gh api --paginate "repos/$env:REPO/pulls/$env:PR_NUMBER/files" --jq '.[].filename')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list PR files.' }
          if ($files -notcontains 'governance/owners.yml') {
            Write-Host 'No change to governance/owners.yml; governance gate passed.'
            exit 0
          }

          # Read the authoritative ownership policy from the PR base commit.
          # Never trust ownership additions proposed within the PR itself.
          $encoded = gh api "repos/$env:REPO/contents/governance/owners.yml?ref=$env:BASE_SHA" --jq '.content'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($encoded)) {
            throw 'Cannot read governance/owners.yml from the PR base commit.'
          }
          $yamlText = [Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String(($encoded -replace '\s', ''))
          )

          # Parse the course's expected owners.yml structure:
          # environments:
          #   governance:
          #     owners:
          #       - github-username
          $lines = $yamlText -split "`n"
          $inEnvironments = $false
          $inGovernance = $false
          $inOwners = $false
          $owners = @()
          foreach ($line in $lines) {
            $line = $line.TrimEnd("`r")
            if ($line -match '^environments:\s*(?:#.*)?$') { $inEnvironments = $true; continue }
            if (-not $inEnvironments) { continue }
            if ($line -match '^\S' -and $line -notmatch '^environments:') { break }
            if ($line -match '^  ([\w-]+):\s*(?:#.*)?$') {
              $inGovernance = ($Matches[1] -eq 'governance')
              $inOwners = $false
              continue
            }
            if (-not $inGovernance) { continue }
            if ($line -match '^    owners:\s*(?:#.*)?$') { $inOwners = $true; continue }
            if ($line -match '^    \S' -and $line -notmatch '^    owners:') { $inOwners = $false }
            if ($inOwners -and $line -match '^      -\s+([A-Za-z0-9-]+)\s*(?:#.*)?$') {
              $owners += $Matches[1].ToLowerInvariant()
            }
          }
          $owners = @($owners | Select-Object -Unique)
          if ($owners.Count -eq 0) {
            throw 'GOVERNANCE BOOTSTRAP REQUIRED: no governance owners defined on the PR base commit.'
          }

          # GitHub PR author is the identity checked by this training gate.
          # Do not use commit.author.login: GitHub may map it to another account.
          $pr = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read PR metadata.' }
          $author = ([string]$pr.user.login).ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($author)) { throw 'Cannot identify PR author.' }

          Write-Host "Governance owners on base: $($owners -join ', ')"
          Write-Host "PR author: $author"
          if ($owners -notcontains $author) {
            throw "GOVERNANCE BLOCK: PR author '$author' is not an existing governance owner."
          }
          Write-Host 'Governance-of-governance gate PASSED.'
