name: change-all

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "envs/**"

permissions:
  id-token: write
  contents: read

jobs:
  validate-promotion-order:
    name: Validate promotion order
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read pinned network module versions
        shell: pwsh
        run: |
          function Get-NetworkVersion {
            param(
              [Parameter(Mandatory=$true)]
              [string]$Environment
            )

            $mainTf = "envs/$Environment/main.tf"

            if (-not (Test-Path $mainTf)) {
              throw "Cannot find $mainTf"
            }

            $content = Get-Content -Raw -Path $mainTf

            $match = [regex]::Match(
              $content,
              'terraform-aws-module-network\.git\?ref=v?(\d+\.\d+\.\d+)'
            )

            if (-not $match.Success) {
              throw "Could not detect network module version in $mainTf"
            }

            return [version]$match.Groups[1].Value
          }

          $devVersion  = Get-NetworkVersion -Environment "dev"
          $testVersion = Get-NetworkVersion -Environment "test"
          $prodVersion = Get-NetworkVersion -Environment "prod"

          Write-Host "Detected network module versions:"
          Write-Host "DEV  = $devVersion"
          Write-Host "TEST = $testVersion"
          Write-Host "PROD = $prodVersion"

          if ($testVersion -gt $devVersion) {
            throw "Promotion blocked: TEST network module version ($testVersion) is ahead of DEV ($devVersion)."
          }

          if ($prodVersion -gt $testVersion) {
            throw "Promotion blocked: PROD network module version ($prodVersion) is ahead of TEST ($testVersion)."
          }

          Write-Host "Promotion order check passed."

  dev:
    name: Apply DEV
    needs: validate-promotion-order
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inspect OIDC Claims
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.request import Request, urlopen
          
          # Request the same audience used by the AWS credentials action.
          parts = urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["audience"] = "sts.amazonaws.com"
          url = urlunsplit(parts._replace(query=urlencode(query)))
          request = Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          try:
              with urlopen(request, timeout=30) as response:
                  token = json.load(response)["value"]
          except (HTTPError, URLError):
              raise SystemExit("Could not request the GitHub OIDC token.") from None
          
          # Decode for inspection only; AWS validates the signature when assuming the role.
          # Keep the complete token and request credentials out of the log.
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          fields = (
              "iss", "aud", "sub", "repository", "repository_id",
              "repository_owner", "repository_owner_id", "environment", "ref"
          )
          print(json.dumps({key: claims.get(key) for key in fields}, indent=2))
          PYTHON

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        working-directory: envs/dev
        run: terraform init -upgrade -input=false

      - name: Terraform Plan
        working-directory: envs/dev
        run: terraform plan -input=false

      - name: Terraform Apply
        working-directory: envs/dev
        run: terraform apply -auto-approve -input=false

  test:
    name: Apply TEST
    needs: dev
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inspect OIDC Claims
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.request import Request, urlopen
          
          # Request the same audience used by the AWS credentials action.
          parts = urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["audience"] = "sts.amazonaws.com"
          url = urlunsplit(parts._replace(query=urlencode(query)))
          request = Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          try:
              with urlopen(request, timeout=30) as response:
                  token = json.load(response)["value"]
          except (HTTPError, URLError):
              raise SystemExit("Could not request the GitHub OIDC token.") from None
          
          # Decode for inspection only; AWS validates the signature when assuming the role.
          # Keep the complete token and request credentials out of the log.
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          fields = (
              "iss", "aud", "sub", "repository", "repository_id",
              "repository_owner", "repository_owner_id", "environment", "ref"
          )
          print(json.dumps({key: claims.get(key) for key in fields}, indent=2))
          PYTHON

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        working-directory: envs/test
        run: terraform init -upgrade -input=false

      - name: Terraform Plan
        working-directory: envs/test
        run: terraform plan -input=false

      - name: Terraform Apply
        working-directory: envs/test
        run: terraform apply -auto-approve -input=false

  prod:
    name: Apply PROD
    needs: test
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inspect OIDC Claims
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.request import Request, urlopen
          
          # Request the same audience used by the AWS credentials action.
          parts = urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["audience"] = "sts.amazonaws.com"
          url = urlunsplit(parts._replace(query=urlencode(query)))
          request = Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          try:
              with urlopen(request, timeout=30) as response:
                  token = json.load(response)["value"]
          except (HTTPError, URLError):
              raise SystemExit("Could not request the GitHub OIDC token.") from None
          
          # Decode for inspection only; AWS validates the signature when assuming the role.
          # Keep the complete token and request credentials out of the log.
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          fields = (
              "iss", "aud", "sub", "repository", "repository_id",
              "repository_owner", "repository_owner_id", "environment", "ref"
          )
          print(json.dumps({key: claims.get(key) for key in fields}, indent=2))
          PYTHON

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        working-directory: envs/prod
        run: terraform init -upgrade -input=false

      - name: Terraform Plan
